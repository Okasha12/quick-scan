name: quickscan
description: Simple document scanner - scan, save as PDF, share.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cunning_document_scanner: ^1.2.3
  google_mobile_ads: 9.2.0
  path_provider: ^2.1.5
  pdf: ^3.11.1
  share_plus: ^10.1.4

flutter:
  uses-material-design: true
  
