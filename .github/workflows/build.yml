name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project and add our code
        run: |
          mkdir -p /tmp/keep
          cp main.dart pubspec.yaml /tmp/keep/
          flutter create --platforms=android --org com.quickscan --project-name quickscan .
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          mkdir -p lib
          cp /tmp/keep/main.dart lib/main.dart
      - name: Patch Android (AdMob test App ID, minSdk 23)
        run: |
          sed -i 's|</application>|<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/></application>|' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle* || true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: QuickScan-APK
          path: build/app/outputs/flutter-apk/app-release.apk
